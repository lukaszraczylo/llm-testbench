name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Version, tag, and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: semver
        uses: lukaszraczylo/semver-generator@v1.17.18
        with:
          config_file: semver.yaml
          repository_local: true
          existing: true

      - name: Create tag if new
        id: tag
        run: |
          VERSION="v${{ steps.semver.outputs.semantic_version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists; skipping release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.tag.outputs.new == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        if: steps.tag.outputs.new == 'true'
        run: go test -race ./...

      - name: Set up QEMU
        if: steps.tag.outputs.new == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.tag.outputs.new == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag.outputs.new == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        if: steps.tag.outputs.new == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
